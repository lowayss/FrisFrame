name: One-shot DOM contract migration

on:
  push:
    branches:
      - refactor/mcp-first-previs-workflow

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mcp-first-previs-workflow
          fetch-depth: 0
      - name: Update retired export DOM contract
        run: python3 tools/one_shot_update_dom_contract.py
      - name: Verify updated contract
        run: node tests/dom-contract.test.cjs
      - name: Commit contract migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/dom-contract.test.cjs; then
            echo "No contract diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dom-contract.test.cjs
          git commit -m "Flip retired export DOM contracts"
          git push origin HEAD:refactor/mcp-first-previs-workflow
