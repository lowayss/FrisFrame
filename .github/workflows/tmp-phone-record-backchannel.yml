name: Temporary phone record backchannel patch
on:
  push:
    branches:
      - feat/phone-director-record-backchannel
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-director-record-backchannel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tmp_phone_record_backchannel_patch.py
      - name: Commit patch and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phone-record-backchannel.yml tmp_phone_record_backchannel_patch.py
          git add electron/phone-director-viewfinder.cjs tests/phone-motion-server.test.cjs
          git commit -m "feat: add phone recording status backchannel"
          git push origin HEAD:feat/phone-director-record-backchannel
