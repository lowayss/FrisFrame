name: Validate Physical Camera playhead start

on:
  push:
    branches:
      - refine/physical-camera-precision
    paths:
      - .github/workflows/fix-physical-camera-playhead-start.yml
      - tools/fix_physical_camera_playhead_start.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/physical-camera-precision
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current-playhead start behavior
        run: python3 tools/fix_physical_camera_playhead_start.py
      - name: Run project quality checks
        run: python3 quality_check.py
      - name: Commit validated playhead behavior
        shell: bash
        run: |
          git config user.name "FrisFrame CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-physical-camera-playhead-start.yml tools/fix_physical_camera_playhead_start.py
          git add electron/camera-operator-live-ux.js tests/camera-operator-live-contract.test.cjs
          git commit -m "fix Physical Camera recording start at current playhead"
          git push origin HEAD:refine/physical-camera-precision
