name: One-shot spawn layout and manifest hardening

on:
  push:
    branches:
      - refactor/mcp-first-previs-workflow

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Run one-shot spawn layout and manifest hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/mcp-first-previs-workflow
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply spawn and manifest hardening
        run: python3 tools/one_shot_spawn_manifest_hardening.py

      - name: Verify app syntax
        run: node --check app.js

      - name: Verify spawn layout
        run: node tests/spawn-layout-contract.test.cjs

      - name: Verify UX manifest
        run: node tests/desktop-ux-manifest.test.cjs

      - name: Verify full project contracts
        run: python3 quality_check.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js quality_check.py tests/spawn-layout-contract.test.cjs tests/desktop-ux-manifest.test.cjs
          git commit -m "Improve spawn layout and desktop UX manifest contracts"
          git push origin HEAD:refactor/mcp-first-previs-workflow
