name: One-shot reference workflow refactor

on:
  push:
    branches:
      - refactor/reference-workflow-core-20260829
    paths:
      - .github/workflows/refactor-reference-workflow.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/refactor/reference-workflow-core-20260829'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reference-workflow-core-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact ownership wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'index.html',
              '    <script src="./previs-runtime-core.js?v=20260828-01"></script>\n',
              '    <script src="./previs-runtime-core.js?v=20260829-01"></script>\n'
              '    <script src="./reference-workflow-core.js?v=20260829-01"></script>\n',
          )

          replace_once(
              'server.py',
              '    "/previs-runtime-core.js",\n',
              '    "/previs-runtime-core.js",\n    "/reference-workflow-core.js",\n',
          )

          replace_once(
              'quality_check.py',
              '        "previs-runtime-core.js",\n',
              '        "previs-runtime-core.js",\n        "reference-workflow-core.js",\n',
          )

          replace_once(
              'electron/scripts/build-python-runtime.cjs',
              '  "scene-blocking-core.js",\n  "timeline-core.js",\n',
              '  "scene-blocking-core.js",\n  "previs-runtime-core.js",\n  "reference-workflow-core.js",\n  "timeline-core.js",\n',
          )
          replace_once(
              'electron/scripts/build-python-runtime.cjs',
              '  "multi-camera-core.js",\n  "license_activation.html",\n',
              '  "multi-camera-core.js",\n  "spatial-scale-core.js",\n  "license_activation.html",\n',
          )

          replace_once(
              'tests/reference-batch-export.test.cjs',
              '} = require("../previs-runtime-core.js");',
              '} = require("../reference-workflow-core.js");',
          )

          replace_once(
              'tests/reference-batch-policy.test.cjs',
              'const runtime = require("../previs-runtime-core.js");\nconst {\n  exportReferenceBatchSafely,\n  partitionReferenceBatchByReadiness,\n} = runtime;\n',
              'const motion = require("../motion-core.js");\nconst workflow = require("../reference-workflow-core.js");\nconst {\n  exportReferenceBatchSafely,\n  partitionReferenceBatchByReadiness,\n} = workflow;\n\nassert.equal(partitionReferenceBatchByReadiness, motion.partitionReferenceBatchByReadiness,\n  "workflow must reuse the motion-core READY/REVIEW/BLOCKED partitioner");\n',
          )

          old_readiness = '''const motion = require("../motion-core.js");
          const runtime = require("../previs-runtime-core.js");
          const {
            SEEDANCE_REFERENCE_MAX_SECONDS,
            evaluateProjectReferenceReadiness,
            evaluateReferenceReadiness,
            isFrameAligned,
          } = runtime;

          assert.equal(runtime.SEEDANCE_REFERENCE_MAX_SECONDS, motion.SEEDANCE_REFERENCE_MAX_SECONDS,
            "runtime must expose the motion-core Seedance reference limit");
          assert.equal(runtime.collectReferenceBatchCuts, motion.collectReferenceBatchCuts,
            "runtime must reuse the motion-core batch-cut collector");
          assert.equal(runtime.isFrameAligned, motion.isFrameAligned,
            "runtime must reuse the motion-core frame-grid evaluator");
          assert.equal(runtime.evaluateReferenceReadiness, motion.evaluateReferenceReadiness,
            "runtime must reuse the motion-core readiness evaluator");
          assert.equal(runtime.evaluateProjectReferenceReadiness, motion.evaluateProjectReferenceReadiness,
            "runtime must reuse the motion-core project readiness evaluator");
          assert.equal(runtime.partitionReferenceBatchByReadiness, motion.partitionReferenceBatchByReadiness,
            "runtime must reuse the motion-core READY/REVIEW/BLOCKED partitioner");
          '''.replace('          ', '')
          new_readiness = '''const motion = require("../motion-core.js");
          const workflow = require("../reference-workflow-core.js");
          const {
            SEEDANCE_REFERENCE_MAX_SECONDS,
            evaluateProjectReferenceReadiness,
            evaluateReferenceReadiness,
            isFrameAligned,
          } = motion;

          assert.equal(workflow.SEEDANCE_REFERENCE_MAX_SECONDS, motion.SEEDANCE_REFERENCE_MAX_SECONDS,
            "workflow must expose the motion-core Seedance reference limit");
          assert.equal(workflow.collectReferenceBatchCuts, motion.collectReferenceBatchCuts,
            "workflow must reuse the motion-core batch-cut collector");
          assert.equal(workflow.evaluateReferenceReadiness, motion.evaluateReferenceReadiness,
            "workflow must reuse the motion-core readiness evaluator");
          assert.equal(workflow.evaluateProjectReferenceReadiness, motion.evaluateProjectReferenceReadiness,
            "workflow must reuse the motion-core project readiness evaluator");
          assert.equal(workflow.partitionReferenceBatchByReadiness, motion.partitionReferenceBatchByReadiness,
            "workflow must reuse the motion-core READY/REVIEW/BLOCKED partitioner");
          '''.replace('          ', '')
          replace_once('tests/reference-readiness.test.cjs', old_readiness, new_readiness)

          replace_once(
              'tests/reference-video-contract.test.cjs',
              'const runtime = read("previs-runtime-core.js");\n',
              'const runtime = read("previs-runtime-core.js");\nconst workflow = read("reference-workflow-core.js");\n',
          )
          replace_once(
              'tests/reference-video-contract.test.cjs',
              'const runtimeIndex = html.indexOf("./previs-runtime-core.js");\nconst appIndex = html.indexOf("./app.js");\nassert.ok(motionIndex >= 0 && runtimeIndex > motionIndex && appIndex > runtimeIndex,\n  "motion core must own reference semantics before the runtime adapter and app load");\n',
              'const runtimeIndex = html.indexOf("./previs-runtime-core.js");\nconst workflowIndex = html.indexOf("./reference-workflow-core.js");\nconst appIndex = html.indexOf("./app.js");\nassert.ok(motionIndex >= 0 && runtimeIndex > motionIndex && workflowIndex > runtimeIndex && appIndex > workflowIndex,\n  "motion core, runtime adapter, reference workflow, and app must load in dependency order");\n',
          )
          replace_once(
              'tests/reference-video-contract.test.cjs',
              'assert.ok(runtime.includes("installReferenceFrameSemantics(root)"));\n',
              'assert.ok(runtime.includes("installReferenceFrameSemantics(root)"));\n'
              'assert.ok(workflow.includes(\'require("./motion-core.js")\'),\n'
              '  "Node reference workflow must import the pure planning owner");\n'
              'assert.ok(workflow.includes("root?.FrisFrameMotionCore"),\n'
              '  "browser reference workflow must reuse the already-loaded motion core");\n'
              'assert.ok(workflow.includes("installBatchReferenceExportUi(root)"));\n'
              'assert.ok(workflow.includes("installReferenceReadinessUi(root)"));\n'
              'assert.equal(runtime.includes("exportReferenceVideoBatch"), false,\n'
              '  "runtime adapter must not own reference batch export anymore");\n',
          )

          replace_once(
              'tests/electron-contract.test.cjs',
              'assert.ok(server.includes(\'"/scene-blocking-core.js"\'));\nassert.ok(server.includes(\'"/timeline-core.js"\'));\n',
              'assert.ok(server.includes(\'"/scene-blocking-core.js"\'));\n'
              'assert.ok(server.includes(\'"/previs-runtime-core.js"\'));\n'
              'assert.ok(server.includes(\'"/reference-workflow-core.js"\'));\n'
              'assert.ok(server.includes(\'"/spatial-scale-core.js"\'));\n'
              'assert.ok(server.includes(\'"/timeline-core.js"\'));\n',
          )
          replace_once(
              'tests/electron-contract.test.cjs',
              'assert.ok(runtimeBuilder.includes(\'"scene-blocking-core.js"\'), "desktop runtime must bundle scene-blocking-core.js");\nassert.ok(runtimeBuilder.includes(\'"timeline-core.js"\'), "desktop runtime must bundle timeline-core.js");\n',
              'assert.ok(runtimeBuilder.includes(\'"scene-blocking-core.js"\'), "desktop runtime must bundle scene-blocking-core.js");\n'
              'assert.ok(runtimeBuilder.includes(\'"previs-runtime-core.js"\'), "desktop runtime must bundle previs-runtime-core.js");\n'
              'assert.ok(runtimeBuilder.includes(\'"reference-workflow-core.js"\'), "desktop runtime must bundle reference-workflow-core.js");\n'
              'assert.ok(runtimeBuilder.includes(\'"spatial-scale-core.js"\'), "desktop runtime must bundle spatial-scale-core.js");\n'
              'assert.ok(runtimeBuilder.includes(\'"timeline-core.js"\'), "desktop runtime must bundle timeline-core.js");\n',
          )

          Path('.github/workflows/refactor-reference-workflow.yml').unlink()

      - name: Run full project checks
        run: python3 quality_check.py
      - name: Commit exact refactor wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire dedicated reference workflow module"
          git push origin HEAD:refactor/reference-workflow-core-20260829
