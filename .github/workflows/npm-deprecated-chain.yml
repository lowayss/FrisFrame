name: NPM deprecated dependency chain

on:
  push:
    branches:
      - diagnostic/npm-deprecated-chain-2026-08-31

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Explain deprecated dependency chains
        shell: bash
        run: |
          set +e
          for pkg in inflight rimraf glob boolean; do
            echo ""
            echo "===== npm explain $pkg ====="
            npm explain "$pkg"
          done
          exit 0
