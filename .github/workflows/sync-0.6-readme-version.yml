name: Sync 0.6 README version

on:
  push:
    branches:
      - chore/frisframe-0.6.0-version

permissions:
  contents: write

jobs:
  sync-readme-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/frisframe-0.6.0-version
      - name: Sync README artifact versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['README.md', 'README.en.md']) {
            let text = fs.readFileSync(file, 'utf8');
            text = text
              .replaceAll('FrisFrame-0.5.0-arm64.dmg', 'FrisFrame-0.6.0-arm64.dmg')
              .replaceAll('FrisFrame-0.5.0-x64.exe', 'FrisFrame-0.6.0-x64.exe');
            if (file === 'README.md') text = text.replaceAll('`v0.5.0`', '`v0.6.0`');
            fs.writeFileSync(file, text);
          }
          NODE
          git diff --check
          if git diff --quiet -- README.md README.en.md; then
            echo "README versions already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          git commit -m "docs: align desktop artifacts with 0.6.0"
          git push origin HEAD:chore/frisframe-0.6.0-version
