name: Patch MP4 atomic frame write

on:
  push:
    branches:
      - hardening/mp4-atomic-frame-write-20260829

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch atomic frame writes and tests
        shell: python
        run: |
          from pathlib import Path

          server = Path('server.py')
          text = server.read_text(encoding='utf-8')
          marker = '''def json_bytes(payload):
              return json.dumps(payload, ensure_ascii=False).encode("utf-8")


          class PrevisHandler(SimpleHTTPRequestHandler):
          '''
          replacement = '''def json_bytes(payload):
              return json.dumps(payload, ensure_ascii=False).encode("utf-8")


          def atomic_write_bytes(path, data):
              destination = Path(path)
              temporary = destination.with_name(f".{destination.name}.{uuid.uuid4().hex}.tmp")
              try:
                  temporary.write_bytes(data)
                  os.replace(temporary, destination)
              finally:
                  try:
                      temporary.unlink(missing_ok=True)
                  except OSError:
                      pass


          class PrevisHandler(SimpleHTTPRequestHandler):
          '''
          if marker not in text:
              raise SystemExit('json_bytes insertion marker not found')
          text = text.replace(marker, replacement, 1)
          old_write = '            frame_path.write_bytes(data)\n'
          new_write = '            atomic_write_bytes(frame_path, data)\n'
          if text.count(old_write) != 1:
              raise SystemExit(f'frame write marker count: {text.count(old_write)}')
          server.write_text(text.replace(old_write, new_write, 1), encoding='utf-8')

          test = Path('tests/test_server_security.py')
          test_text = test.read_text(encoding='utf-8')
          import_marker = 'import unittest\n'
          if 'from unittest import mock\n' not in test_text:
              if import_marker not in test_text:
                  raise SystemExit('unittest import marker not found')
              test_text = test_text.replace(import_marker, import_marker + 'from unittest import mock\n', 1)

          class_marker = '\n\nclass ProjectManagementApiTests(unittest.TestCase):\n'
          method = '''
              def test_atomic_frame_write_preserves_previous_file_on_failure(self):
                  with tempfile.TemporaryDirectory() as directory:
                      destination = Path(directory) / "frame_000001.jpg"
                      destination.write_bytes(b"old-frame")

                      server.atomic_write_bytes(destination, b"new-frame")
                      self.assertEqual(destination.read_bytes(), b"new-frame")

                      destination.write_bytes(b"stable-frame")
                      with mock.patch.object(server.os, "replace", side_effect=OSError("simulated replace failure")):
                          with self.assertRaises(OSError):
                              server.atomic_write_bytes(destination, b"broken-retry")

                      self.assertEqual(destination.read_bytes(), b"stable-frame")
                      temporary_files = [entry for entry in Path(directory).iterdir() if entry.name.endswith(".tmp")]
                      self.assertEqual(temporary_files, [])
          '''
          if 'test_atomic_frame_write_preserves_previous_file_on_failure' not in test_text:
              if class_marker not in test_text:
                  raise SystemExit('ProjectManagementApiTests marker not found')
              test_text = test_text.replace(class_marker, method + class_marker, 1)
          test.write_text(test_text, encoding='utf-8')
      - name: Run full quality checks
        run: python3 quality_check.py
      - name: Commit validated hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.py tests/test_server_security.py
          git commit -m "Make MP4 frame retries atomic"
          git push
