name: One-shot source evaluation planning refactor

on:
  push:
    branches:
      - refactor/source-evaluation-plan-20260829
    paths:
      - .github/workflows/refactor-source-evaluation-plan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-evaluation-plan-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract source evaluation planning
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          transition_block = '''  function transitionProgress(time, startTime, endTime, transition = "smooth") {
            const start = finiteNumber(startTime, 0);
            const end = finiteNumber(endTime, start + 1);
            const span = Math.max(0.000001, end - start);
            const raw = clamp((finiteNumber(time, start) - start) / span, 0, 1);
            const mode = normalizeTransition(transition);
            if (mode === "cut" || mode === "hold") return raw >= 1 ? 1 : 0;
            if (mode === "linear") return raw;
            return raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
          }

          function poseFieldsChanged'''.replace('          ', '')
          transition_replacement = '''  function transitionProgress(time, startTime, endTime, transition = "smooth") {
            const start = finiteNumber(startTime, 0);
            const end = finiteNumber(endTime, start + 1);
            const span = Math.max(0.000001, end - start);
            const raw = clamp((finiteNumber(time, start) - start) / span, 0, 1);
            const mode = normalizeTransition(transition);
            if (mode === "cut" || mode === "hold") return raw >= 1 ? 1 : 0;
            if (mode === "linear") return raw;
            return raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
          }

          function sourceKeyframeEvaluationPlan(keyframes = [], time = 0) {
            const keys = Array.isArray(keyframes) ? keyframes : [];
            if (!keys.length) return { kind: "fallback" };
            const currentTime = finiteNumber(time, 0);
            const first = keys[0];
            if (keys.length === 1 || currentTime <= finiteNumber(first?.time, 0)) {
              return { kind: "key", keyframe: first };
            }
            const last = keys[keys.length - 1];
            if (currentTime >= finiteNumber(last?.time, currentTime)) {
              return { kind: "key", keyframe: last };
            }

            let start = first;
            let end = last;
            for (let index = 0; index < keys.length - 1; index += 1) {
              const candidateStart = keys[index];
              const candidateEnd = keys[index + 1];
              const candidateStartTime = finiteNumber(candidateStart?.time, 0);
              const candidateEndTime = finiteNumber(candidateEnd?.time, candidateStartTime);
              if (currentTime >= candidateStartTime && currentTime <= candidateEndTime) {
                start = candidateStart;
                end = candidateEnd;
                break;
              }
            }

            const transition = normalizeTransition(end?.transition);
            const startTime = finiteNumber(start?.time, 0);
            const endTime = finiteNumber(end?.time, startTime);
            const easedProgress = transitionProgress(currentTime, startTime, endTime, transition);
            const rawProgress = clamp((currentTime - startTime) / Math.max(0.000001, endTime - startTime), 0, 1);
            // Spatial blocking crosses ordinary keys without braking. Smooth
            // reference easing is applied later by the camera-only reference guard.
            const progress = transition === "smooth" || transition === "linear" ? rawProgress : easedProgress;
            return { kind: "segment", start, end, transition, rawProgress, easedProgress, progress };
          }

          function poseFieldsChanged'''.replace('          ', '')
          replace_once('motion-core.js', transition_block, transition_replacement)
          replace_once(
              'motion-core.js',
              '    smoothReferenceProgress,\n    transitionProgress,\n',
              '    smoothReferenceProgress,\n    sourceKeyframeEvaluationPlan,\n    transitionProgress,\n',
          )

          old_app = '''function interpolateSourceAtTimeFor(renderState, sourceId, time, fallbackPose) {
            const keyframes = sortKeyframes(renderState.motion?.keyframes || []).filter((keyframe) => keyframe.source === sourceId);
            if (!keyframes.length) return clone(fallbackPose);
            if (keyframes.length === 1 || time <= keyframes[0].time) return mergePoseWithFallbackFor(renderState, sourceId, keyframes[0].pose, fallbackPose);
            const last = keyframes[keyframes.length - 1];
            if (time >= last.time) return mergePoseWithFallbackFor(renderState, sourceId, last.pose, fallbackPose);

            let start = keyframes[0];
            let end = last;
            for (let i = 0; i < keyframes.length - 1; i += 1) {
              if (time >= keyframes[i].time && time <= keyframes[i + 1].time) {
                start = keyframes[i];
                end = keyframes[i + 1];
                break;
              }
            }
            const transition = normalizeTransition(end.transition);
            const easedProgress = transitionProgress(time, start.time, end.time, transition);
            const rawProgress = clamp((time - start.time) / Math.max(0.000001, end.time - start.time), 0, 1);
            // Spatial blocking must cross ordinary key boundaries without braking at
            // every marker. Holds and cuts retain their explicit discontinuous behavior.
            const progress = transition === "smooth" || transition === "linear" ? rawProgress : easedProgress;
            return interpolatePoseFor(renderState, sourceId, start.pose, end.pose, progress, fallbackPose, end);
          }
          '''.replace('          ', '')
          new_app = '''function interpolateSourceAtTimeFor(renderState, sourceId, time, fallbackPose) {
            const keyframes = sortKeyframes(renderState.motion?.keyframes || []).filter((keyframe) => keyframe.source === sourceId);
            const sourceKeyframeEvaluationPlan = window.FrisFrameMotionCore?.sourceKeyframeEvaluationPlan;
            if (typeof sourceKeyframeEvaluationPlan !== "function") {
              throw new Error("모션 코어의 키프레임 평가 계획기를 불러오지 못했습니다.");
            }
            const plan = sourceKeyframeEvaluationPlan(keyframes, time);
            if (plan.kind === "fallback") return clone(fallbackPose);
            if (plan.kind === "key") return mergePoseWithFallbackFor(renderState, sourceId, plan.keyframe.pose, fallbackPose);
            return interpolatePoseFor(renderState, sourceId, plan.start.pose, plan.end.pose, plan.progress, fallbackPose, plan.end);
          }
          '''.replace('          ', '')
          replace_once('app.js', old_app, new_app)

          replace_once(
              'tests/motion-core.test.cjs',
              '  samplePlanarPath,\n  transitionProgress,\n',
              '  samplePlanarPath,\n  sourceKeyframeEvaluationPlan,\n  transitionProgress,\n',
          )
          transition_test_anchor = '''assert.equal(transitionProgress(1, 0, 1, "cut"), 1);
          '''.replace('          ', '')
          transition_tests = '''assert.equal(transitionProgress(1, 0, 1, "cut"), 1);

          const sourcePlanKeys = [
            { id: "k0", time: 0, pose: { x: 0 } },
            { id: "k1", time: 2, transition: "smooth", pose: { x: 1 } },
            { id: "k2", time: 4, transition: "hold", pose: { x: 2 } },
            { id: "k3", time: 6, transition: "cut", pose: { x: 3 } },
          ];
          assert.equal(sourceKeyframeEvaluationPlan([], 1).kind, "fallback");
          const sourcePlanBefore = sourceKeyframeEvaluationPlan(sourcePlanKeys, -1);
          assert.equal(sourcePlanBefore.kind, "key");
          assert.equal(sourcePlanBefore.keyframe.id, "k0");
          const sourcePlanSmooth = sourceKeyframeEvaluationPlan(sourcePlanKeys, 0.5);
          assert.equal(sourcePlanSmooth.kind, "segment");
          assert.equal(sourcePlanSmooth.end.id, "k1");
          assert.equal(sourcePlanSmooth.transition, "smooth");
          near(sourcePlanSmooth.rawProgress, 0.25);
          near(sourcePlanSmooth.easedProgress, 0.125);
          near(sourcePlanSmooth.progress, 0.25, 0.000001);
          const sourcePlanHold = sourceKeyframeEvaluationPlan(sourcePlanKeys, 3);
          assert.equal(sourcePlanHold.end.id, "k2");
          assert.equal(sourcePlanHold.progress, 0, "hold must remain on the source key before arrival");
          const sourcePlanHoldArrival = sourceKeyframeEvaluationPlan(sourcePlanKeys, 4);
          assert.equal(sourcePlanHoldArrival.end.id, "k2");
          assert.equal(sourcePlanHoldArrival.progress, 1, "hold must apply the destination exactly at arrival");
          const sourcePlanCut = sourceKeyframeEvaluationPlan(sourcePlanKeys, 5);
          assert.equal(sourcePlanCut.end.id, "k3");
          assert.equal(sourcePlanCut.progress, 0, "cut must remain on the source key before arrival");
          const sourcePlanAfter = sourceKeyframeEvaluationPlan(sourcePlanKeys, 7);
          assert.equal(sourcePlanAfter.kind, "key");
          assert.equal(sourcePlanAfter.keyframe.id, "k3");
          '''.replace('          ', '')
          replace_once('tests/motion-core.test.cjs', transition_test_anchor, transition_tests)
          replace_once(
              'tests/motion-core.test.cjs',
              'console.log("motion-core: transitions, path constraints, camera reference speed, and base pose composition passed");\n',
              'console.log("motion-core: source timing, transitions, path constraints, camera reference speed, and base pose composition passed");\n',
          )

          replace_once(
              'tests/dom-contract.test.cjs',
              'assert.match(app, /const progress = transition === "smooth" \\|\\| transition === "linear" \\? rawProgress : easedProgress;/, "continuous motion must not brake at ordinary keyframe boundaries");\n',
              'assert.match(motion, /const progress = transition === "smooth" \\|\\| transition === "linear" \\? rawProgress : easedProgress;/, "motion-core source planning must not brake continuous motion at ordinary keyframe boundaries");\n'
              'assert.ok(app.includes("window.FrisFrameMotionCore?.sourceKeyframeEvaluationPlan"), "app source evaluation must delegate keyframe timing to motion-core");\n',
          )

          replace_once(
              'tests/reference-video-contract.test.cjs',
              'assert.ok(app.includes("return interpolatePoseFor(renderState, sourceId, start.pose, end.pose, progress, fallbackPose, end);"),\n  "render-state interpolation must reach the guarded pose evaluator");\n',
              'assert.ok(app.includes("return interpolatePoseFor(renderState, sourceId, plan.start.pose, plan.end.pose, plan.progress, fallbackPose, plan.end);"),\n'
              '  "render-state interpolation must reach the guarded pose evaluator through the core timing plan");\n'
              'assert.ok(app.includes("window.FrisFrameMotionCore?.sourceKeyframeEvaluationPlan"),\n'
              '  "the app source evaluator must delegate keyframe timing to motion-core");\n'
              'assert.ok(motion.includes("function sourceKeyframeEvaluationPlan"),\n'
              '  "motion-core must own source keyframe segment and progress planning");\n',
          )

      - name: Run full project checks
        run: python3 quality_check.py
      - name: Commit source evaluation planning extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js motion-core.js tests/motion-core.test.cjs tests/dom-contract.test.cjs tests/reference-video-contract.test.cjs
          git diff --cached --check
          git commit -m "Extract source keyframe evaluation planning"
          git push origin HEAD:refactor/source-evaluation-plan-20260829
