name: Temporary phone handheld reliability patch
on:
  push:
    branches:
      - fix/phone-handheld-reliability-v2
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-handheld-reliability-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reliability patch
        run: python tmp_phone_reliability_patch.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phone-reliability-patch.yml tmp_phone_reliability_patch.py
          git add electron/phone-director-viewfinder.cjs electron/main.cjs tests/phone-motion-server.test.cjs
          git commit -m "fix: harden phone handheld reliability"
          git push origin HEAD:fix/phone-handheld-reliability-v2
