name: One-shot desktop platform glue

on:
  push:
    branches:
      - feature/windows-macos-desktop-builds-20260829
    paths:
      - ".github/workflows/patch-desktop-platform-glue.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/windows-macos-desktop-builds-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply cross-platform glue
        run: python3 tools/patch_desktop_platform_glue.py
      - name: Verify JavaScript syntax
        run: |
          node --check electron/main.cjs
          node --check electron/after-pack.cjs
          node --check electron/scripts/build-python-runtime.cjs
          node --check electron/scripts/stage-runtime.cjs
          node --check electron/scripts/build-icon.cjs
          node --check electron/scripts/verify-package.cjs
      - name: Run project contracts
        run: npm run check
      - name: Commit cross-platform glue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.cjs tests/electron-contract.test.cjs README.md
          git diff --cached --check
          git commit -m "Wire Windows and macOS desktop runtimes"
          git push origin HEAD:feature/windows-macos-desktop-builds-20260829
