name: Temporary phone reliability test fix
on:
  push:
    branches:
      - fix/phone-handheld-reliability-v2
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-handheld-reliability-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tmp_phone_reliability_test_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phone-reliability-test-fix.yml tmp_phone_reliability_test_fix.py
          git add tests/phone-motion-server.test.cjs
          git commit -m "test: align phone applied acknowledgement contract"
          git push origin HEAD:fix/phone-handheld-reliability-v2
