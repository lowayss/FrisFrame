name: One-shot actor smooth root timing

on:
  push:
    branches:
      - fix/actor-smooth-root-timing-20260829
    paths:
      - .github/workflows/fix-actor-smooth-root-timing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/actor-smooth-root-timing-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply actor smooth root timing
        run: python3 tools/fix_actor_smooth_root_timing.py
      - name: Migrate guarded evaluator contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/reference-video-contract.test.cjs")
          text = path.read_text(encoding="utf-8")
          old = r'''assert.match(app, /interpolatePoseFor\([\s\S]*?plan\.progress,[\s\S]*?plan\.end,[\s\S]*?evaluationOptions/,
            "render-state interpolation must reach the guarded pose evaluator through the core timing plan and camera reference options");'''
          new = r'''assert.match(app, /interpolatePoseFor\([\s\S]*?interpolationProgress,[\s\S]*?plan\.end,[\s\S]*?evaluationOptions/,
            "render-state interpolation must reach the guarded pose evaluator through authored actor timing and camera reference options");'''
          if text.count(old) != 1:
              raise SystemExit(f"contract anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run full project checks
        run: python3 quality_check.py
      - name: Commit actor smooth root timing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-core.js app.js tests/motion-core.test.cjs tests/reference-frame-ownership.test.cjs tests/reference-video-contract.test.cjs
          git diff --cached --check
          git commit -m "Apply smooth timing to actor root motion"
          git push origin HEAD:fix/actor-smooth-root-timing-20260829
