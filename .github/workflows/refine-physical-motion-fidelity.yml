name: Refine Physical Camera motion fidelity

on:
  push:
    branches:
      - refine/physical-camera-precision
    paths:
      - .github/workflows/refine-physical-motion-fidelity.yml
      - tools/refine_physical_motion_fidelity.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/physical-camera-precision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Physical Camera motion fidelity refinement
        run: python3 tools/refine_physical_motion_fidelity.py

      - name: Run project quality checks
        run: python3 quality_check.py

      - name: Commit refined Physical Camera motion fidelity
        shell: bash
        run: |
          git config user.name "FrisFrame CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refine-physical-motion-fidelity.yml tools/refine_physical_motion_fidelity.py
          git add electron/interaction-ux.js electron/camera-operator-live-ux.js electron/phone-motion-camera-ux.js tests/camera-operator-core.test.cjs tests/camera-operator-live-contract.test.cjs tests/physical-camera-take-context.test.cjs
          git commit -m "refine physical camera motion fidelity"
          git push origin HEAD:refine/physical-camera-precision
