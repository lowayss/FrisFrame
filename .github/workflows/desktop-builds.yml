name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "*.py"
      - "*.js"
      - "*.html"
      - "*.css"
      - "vendor/**"
      - "electron/**"
      - "tests/electron-contract.test.cjs"
      - "tests/desktop-publish-contract.test.cjs"
      - "SIGNING.md"
      - "README.md"
      - ".github/workflows/desktop-builds.yml"
      - ".github/workflows/release-preflight.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "*.py"
      - "*.js"
      - "*.html"
      - "*.css"
      - "vendor/**"
      - "electron/**"
      - "tests/electron-contract.test.cjs"
      - "tests/desktop-publish-contract.test.cjs"
      - "SIGNING.md"
      - "README.md"
      - ".github/workflows/desktop-builds.yml"
      - ".github/workflows/release-preflight.yml"

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS · Apple Silicon
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Validate release tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          production_tag="v${package_version}"
          beta_tag="${production_tag}-beta"
          if [ "$GITHUB_REF_NAME" != "$production_tag" ] && [ "$GITHUB_REF_NAME" != "$beta_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match an allowed tag for package version $package_version (expected $production_tag or $beta_tag)."
            exit 1
          fi
      - name: Verify source contracts
        run: npm run check

      - name: Build unsigned macOS package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || endsWith(github.ref_name, '-beta') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run desktop:prepare
          npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Validate macOS release secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-beta') }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name GitHub Actions secret is required for production macOS releases."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build signed and notarized macOS package
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-beta') }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run desktop:prepare
          npx electron-builder --mac dmg zip --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=true

      - name: Verify macOS package
        run: npm run desktop:verify

      - name: Verify Apple signature and notarization
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-beta') }}
        run: |
          APP="release/mac-arm64/FrisFrame.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FrisFrame-macOS-arm64
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  windows:
    name: Windows · x64
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Validate release tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $productionTag = "v$packageVersion"
          $betaTag = "$productionTag-beta"
          if (($env:GITHUB_REF_NAME -ne $productionTag) -and ($env:GITHUB_REF_NAME -ne $betaTag)) {
            throw "Release tag $env:GITHUB_REF_NAME does not match an allowed tag for package version $packageVersion (expected $productionTag or $betaTag)."
          }
      - name: Verify source contracts
        run: npm run check

      - name: Build unsigned Windows package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || endsWith(github.ref_name, '-beta') }}
        run: |
          npm run desktop:prepare
          npx electron-builder --win nsis --x64 --publish never

      - name: Validate Windows release secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-beta') }}
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { $missing += "WIN_CSC_LINK" }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { $missing += "WIN_CSC_KEY_PASSWORD" }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets for production Windows release: $($missing -join ', ')"
          }

      - name: Build signed Windows package
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-beta') }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm run desktop:prepare
          npx electron-builder --win nsis --x64 --publish never --config.forceCodeSigning=true

      - name: Verify Windows package
        run: npm run desktop:verify

      - name: Verify Windows Authenticode signatures
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-beta') }}
        shell: pwsh
        run: |
          $targets = @(
            (Get-ChildItem -Path release -Filter "FrisFrame-*-x64.exe" | Select-Object -First 1).FullName,
            (Join-Path $PWD "release/win-unpacked/FrisFrame.exe")
          )
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Signed target not found: $target" }
            $signature = Get-AuthenticodeSignature -FilePath $target
            Write-Host "$target -> $($signature.Status) / $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $target" }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: FrisFrame-Windows-x64
          if-no-files-found: error
          path: release/*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: FrisFrame-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            release_args=(--generate-notes --title "FrisFrame $GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" == *-beta ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" release-assets/* "${release_args[@]}"
          fi
