name: NPM audit lockfile fix

on:
  push:
    branches:
      - security/npm-audit-2026-08-31

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/npm-audit-2026-08-31
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply audit fixes to lockfile only
        run: npm audit fix --package-lock-only
      - name: Reinstall exact fixed lockfile
        run: npm ci
      - name: Require zero high-severity audit findings
        shell: bash
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Run project contracts
        run: npm run check
      - name: Commit lockfile security update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already contains all available safe audit fixes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh transitive dependencies for npm audit"
          git push origin HEAD:security/npm-audit-2026-08-31
