name: Apply reference reconstruction v2 patch

on:
  push:
    branches:
      - feat/reference-reconstruction-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reference-reconstruction-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source
        run: python3 scripts/patch_reference_reconstruction_v2.py
      - name: Validate reference reconstruction v2
        run: |
          python3 -m py_compile reference_master_pipeline_mcp.py quality_check.py tests/reference-reconstruction-v2-mcp.py
          python3 tests/reference-master-pipeline-mcp.py
          python3 tests/reference-reconstruction-v2-mcp.py
          python3 tests/spatial-quality-mcp.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch_reference_reconstruction_v2.py
          rm .github/workflows/apply-reference-reconstruction-v2.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add shootable reference reconstruction v2"
          git push origin HEAD:feat/reference-reconstruction-v2
