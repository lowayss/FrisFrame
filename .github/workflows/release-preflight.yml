name: Release preflight

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate (for example v0.6.0)"
        required: true
        default: "v0.6.0"
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release metadata and signing secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Requested release tag $RELEASE_TAG does not match package version $package_version (expected $expected_tag)."
            exit 1
          fi
          echo "Release metadata OK: $RELEASE_TAG"

      - name: Validate signing secret presence
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing. Add it as a GitHub Actions repository secret before creating the release tag."
              missing=1
            fi
          done
          if [ -n "${APPLE_TEAM_ID:-}" ] && [ "${#APPLE_TEAM_ID}" -ne 10 ]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple Developer Team ID."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required signing secrets are present. Secret values were not printed."
