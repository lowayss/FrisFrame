name: Apply autonomous scale inference patch

on:
  push:
    branches:
      - feat/autonomous-scale-inference

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-scale-inference
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source
        run: python3 scripts/patch_autonomous_scale_inference.py
      - name: Validate autonomous scale inference
        run: |
          python3 -m py_compile autonomous_scale_core.py reference_master_pipeline_mcp.py spatial_quality_mcp.py quality_check.py tests/autonomous-scale-inference-mcp.py
          python3 tests/reference-master-pipeline-mcp.py
          python3 tests/reference-reconstruction-v2-mcp.py
          python3 tests/autonomous-scale-inference-mcp.py
          python3 tests/spatial-quality-mcp.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch_autonomous_scale_inference.py
          rm .github/workflows/apply-autonomous-scale.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: infer metric scale autonomously from reference evidence"
          git push origin HEAD:feat/autonomous-scale-inference
