name: Refine Physical Camera keyframes

on:
  push:
    branches:
      - refine/physical-camera-precision
    paths:
      - .github/workflows/refine-physical-keyframes.yml
      - tools/refine_physical_keyframes.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/physical-camera-precision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Physical Camera keyframe refinement
        run: python3 tools/refine_physical_keyframes.py

      - name: Update Physical Camera recording contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/phone-motion-core.test.cjs')
          s = p.read_text(encoding='utf-8')
          old = '  assert.match(phoneMotionUx, /op\\.arm\\(\\)/);\n'
          new = '  assert.match(phoneMotionUx, /op\\.arm\\(\\{ ensureStartKey:true \\}\\)/);\n  assert.match(phoneMotionUx, /op\\?\\.startPhysical/);\n  assert.match(phoneMotionUx, /op\\.adoptStartPose\\(pose, "phone"\\)/);\n'
          if old not in s:
              raise SystemExit('stale Physical Camera arm contract not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run project quality checks
        run: python3 quality_check.py

      - name: Commit refined Physical Camera recording
        shell: bash
        run: |
          git config user.name "FrisFrame CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refine-physical-keyframes.yml tools/refine_physical_keyframes.py
          git add electron/camera-operator-live-ux.js electron/phone-motion-camera-ux.js tests/camera-operator-live-contract.test.cjs tests/physical-camera-take-context.test.cjs tests/phone-motion-core.test.cjs
          git commit -m "refine physical camera keyframe recording"
          git push origin HEAD:refine/physical-camera-precision
