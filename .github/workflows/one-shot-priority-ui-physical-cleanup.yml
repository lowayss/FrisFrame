name: One-shot priority UI physical cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run physical removal of retired app surfaces'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Apply physical cleanup
        run: python3 tools/one_shot_priority_ui_physical_cleanup.py

      - name: Verify source contracts
        run: npm run check

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/one_shot_priority_ui_physical_cleanup.py
          git add app.js index.html styles.css tests/dom-contract.test.cjs
          git commit -m "Physically remove retired app surfaces from main"
          git push origin HEAD:main
