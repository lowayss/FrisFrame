name: Temporary runtime integrity patch

on:
  push:
    branches:
      - hardening/runtime-integrity-v3
    paths:
      - .github/workflows/tmp-runtime-integrity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/runtime-integrity-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          def regex_once(path, pattern, replacement):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern}")
              target.write_text(updated, encoding="utf-8")

          # Electron main: one canonical renderer manifest, deterministic sequential injection,
          # atomic runtime state writes, port fallback, and failed-start cleanup.
          replace_once(
              "electron/main.cjs",
              'const { createPhoneMotionBridge } = require("./phone-motion-server.cjs");\n',
              'const { createPhoneMotionBridge } = require("./phone-motion-server.cjs");\n'
              'const { createRendererInjector } = require("./renderer-injection-core.cjs");\n',
          )
          replace_once(
              "electron/main.cjs",
              'app.setName("FrisFrame");\n',
              '''app.setName("FrisFrame");\n\nconst MAIN_RENDERER_FILES = Object.freeze([\n  "workspace-ux.js",\n  "hud-export-ux.js",\n  "interaction-ux.js",\n  "camera-operator-live-ux.js",\n  "camera-operator-inputs-ux.js",\n  "phone-motion-core.js",\n  "phone-motion-core-absolute-focal.js",\n  "phone-motion-camera-ux.js",\n  "phone-handheld-command-ux.js",\n  "camera-take-browser-ux.js",\n  "selection-ux.js",\n  "alignment-ux.js",\n  "history-safety-ux.js",\n  "scene-cache-ux.js",\n  "dynamic-prop-cache-ux.js",\n  "stage-shell-cache-ux.js",\n  "camera-path-cache-ux.js",\n  "helper-raycast-ux.js",\n  "preview-cache-ux.js",\n  "performance-ux.js",\n]);\n''',
          )
          replace_once(
              "electron/main.cjs",
              '''function writeRuntimeState(statePath, port) {\n  fs.mkdirSync(path.dirname(statePath), { recursive: true });\n  const temporary = `${statePath}.tmp`;\n  fs.writeFileSync(temporary, JSON.stringify({ port, updatedAt: new Date().toISOString() }, null, 2), "utf8");\n  fs.renameSync(temporary, statePath);\n}\n''',
              '''function writeRuntimeState(statePath, port) {\n  fs.mkdirSync(path.dirname(statePath), { recursive: true });\n  const temporary = `${statePath}.${process.pid}.${Date.now()}.tmp`;\n  try {\n    fs.writeFileSync(temporary, JSON.stringify({ port, updatedAt: new Date().toISOString() }, null, 2), "utf8");\n    fs.renameSync(temporary, statePath);\n  } finally {\n    try { fs.rmSync(temporary, { force: true }); } catch { /* Best-effort temp cleanup. */ }\n  }\n}\n''',
          )
          replace_once(
              "electron/main.cjs",
              '  const args = [...launch.args, "--host", "127.0.0.1", "--port", String(persistedPort)];\n',
              '  const args = [...launch.args, "--host", "127.0.0.1", "--port", String(persistedPort), "--fallback-port"];\n',
          )
          replace_once(
              "electron/main.cjs",
              '''  const readyPayload = await Promise.race([\n    ready,\n    new Promise((_resolve, reject) => setTimeout(() => reject(new Error("FrisFrame 로컬 서버 시작 시간이 초과되었습니다.")), 30000)),\n  ]);\n  if (persistedPort && readyPayload.port !== persistedPort) throw new Error("저장된 로컬 포트와 다른 서버가 시작되었습니다.");\n  writeRuntimeState(runtimeStatePath, readyPayload.port);\n  serverOrigin = `http://127.0.0.1:${readyPayload.port}`;\n  await waitForServer(serverOrigin, child, nonce);\n  return serverOrigin;\n''',
              '''  try {\n    const readyPayload = await Promise.race([\n      ready,\n      new Promise((_resolve, reject) => setTimeout(() => reject(new Error("FrisFrame 로컬 서버 시작 시간이 초과되었습니다.")), 30000)),\n    ]);\n    if (persistedPort && readyPayload.port !== persistedPort) {\n      writeLog(`저장된 로컬 포트 ${persistedPort} 사용 불가 · ${readyPayload.port}로 자동 복구`);\n    }\n    writeRuntimeState(runtimeStatePath, readyPayload.port);\n    serverOrigin = `http://127.0.0.1:${readyPayload.port}`;\n    await waitForServer(serverOrigin, child, nonce);\n    return serverOrigin;\n  } catch (error) {\n    if (serverProcess === child) killServerProcess();\n    serverOrigin = "";\n    throw error;\n  }\n''',
          )
          regex_once(
              "electron/main.cjs",
              r'''  window\.webContents\.on\("did-finish-load", \(\) => \{\n    for \(const filename of \[.*?\]\) \{\n      const uxPath = path\.join\(__dirname, filename\);\n      try \{\n        const source = fs\.readFileSync\(uxPath, "utf8"\);\n        window\.webContents\.executeJavaScript\(source, true\)\.catch\(\(error\) => writeLog\(`\$\{filename\} injection failed: \$\{error\.stack \|\| error\}`\)\);\n      \} catch \(error\) \{\n        writeLog\(`\$\{filename\} file failed: \$\{error\.stack \|\| error\}`\);\n      \}\n    \}\n  \}\);\n''',
              '''  const rendererInjector = createRendererInjector({\n    webContents: window.webContents,\n    entries: MAIN_RENDERER_FILES.map((filename) => ({\n      filename,\n      source: fs.readFileSync(path.join(__dirname, filename), "utf8"),\n    })),\n    label: "desktop renderer UX",\n    onError: (error) => writeLog(error?.stack || error),\n  });\n  let rendererFailureGeneration = -1;\n  window.webContents.on("did-start-loading", () => rendererInjector.markLoadStarted());\n  window.webContents.on("did-finish-load", () => {\n    rendererInjector.injectCurrent().catch((error) => {\n      const generation = rendererInjector.getState().generation;\n      if (rendererFailureGeneration === generation || window.isDestroyed()) return;\n      rendererFailureGeneration = generation;\n      dialog.showMessageBox(window, {\n        type: "error",\n        title: "FrisFrame UI 로드 오류",\n        message: "편집 모듈을 안전하게 불러오지 못했습니다.",\n        detail: `${error?.message || error}\\n\\n새로고침 후에도 반복되면 FrisFrame을 다시 실행해 주세요.`,\n        buttons: ["확인"],\n      }).catch((dialogError) => writeLog(`renderer failure dialog failed: ${dialogError?.stack || dialogError}`));\n    });\n  });\n''',
          )

          # Python local server: the Electron runtime may fall back to an ephemeral port only
          # when a persisted local port is genuinely occupied.
          replace_once("server.py", "import argparse\nimport hashlib\n", "import argparse\nimport errno\nimport hashlib\n")
          replace_once(
              "server.py",
              '''def atomic_write_bytes(path, data):\n    destination = Path(path)\n    temporary = destination.with_name(f".{destination.name}.{uuid.uuid4().hex}.tmp")\n    try:\n        temporary.write_bytes(data)\n        os.replace(temporary, destination)\n    finally:\n        try:\n            temporary.unlink(missing_ok=True)\n        except OSError:\n            pass\n\n\nclass PrevisHandler(SimpleHTTPRequestHandler):\n''',
              '''def atomic_write_bytes(path, data):\n    destination = Path(path)\n    temporary = destination.with_name(f".{destination.name}.{uuid.uuid4().hex}.tmp")\n    try:\n        temporary.write_bytes(data)\n        os.replace(temporary, destination)\n    finally:\n        try:\n            temporary.unlink(missing_ok=True)\n        except OSError:\n            pass\n\n\ndef bind_http_server(host, requested_port, handler, allow_port_fallback=False):\n    try:\n        return ThreadingHTTPServer((host, requested_port), handler), False\n    except OSError as error:\n        if (\n            not allow_port_fallback\n            or int(requested_port or 0) <= 0\n            or error.errno != errno.EADDRINUSE\n        ):\n            raise\n        return ThreadingHTTPServer((host, 0), handler), True\n\n\nclass PrevisHandler(SimpleHTTPRequestHandler):\n''',
          )
          replace_once(
              "server.py",
              '    parser.add_argument("--port", type=int, default=default_port)\n    args = parser.parse_args()\n',
              '    parser.add_argument("--port", type=int, default=default_port)\n    parser.add_argument("--fallback-port", action="store_true")\n    args = parser.parse_args()\n',
          )
          replace_once(
              "server.py",
              '    server = ThreadingHTTPServer((args.host, args.port), handler)\n',
              '''    server, used_port_fallback = bind_http_server(\n        args.host, args.port, handler, allow_port_fallback=args.fallback_port\n    )\n    if used_port_fallback:\n        print(\n            "FRISFRAME_PORT_FALLBACK " + json.dumps({\n                "requestedPort": int(args.port),\n                "actualPort": int(server.server_address[1]),\n            }),\n            flush=True,\n        )\n''',
          )

          # Server regression coverage for sticky occupied persisted ports.
          replace_once("tests/test_server_security.py", "import os\nimport sqlite3\n", "import os\nimport socket\nimport sqlite3\n")
          replace_once(
              "tests/test_server_security.py",
              '''            temporary_files = [entry for entry in Path(directory).iterdir() if entry.name.endswith(".tmp")]\n            self.assertEqual(temporary_files, [])\n\n\nclass ProjectManagementApiTests(unittest.TestCase):\n''',
              '''            temporary_files = [entry for entry in Path(directory).iterdir() if entry.name.endswith(".tmp")]\n            self.assertEqual(temporary_files, [])\n\n    def test_local_http_server_falls_back_only_when_requested_port_is_busy(self):\n        blocker = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n        blocker.bind(("127.0.0.1", 0))\n        blocker.listen(1)\n        requested_port = blocker.getsockname()[1]\n        try:\n            with self.assertRaises(OSError):\n                server.bind_http_server(\n                    "127.0.0.1", requested_port, server.PrevisHandler, allow_port_fallback=False\n                )\n            fallback_server, used_fallback = server.bind_http_server(\n                "127.0.0.1", requested_port, server.PrevisHandler, allow_port_fallback=True\n            )\n            try:\n                self.assertTrue(used_fallback)\n                self.assertNotEqual(fallback_server.server_address[1], requested_port)\n                self.assertGreater(int(fallback_server.server_address[1]), 0)\n            finally:\n                fallback_server.server_close()\n        finally:\n            blocker.close()\n\n\nclass ProjectManagementApiTests(unittest.TestCase):\n''',
          )

          # Package and quality manifests.
          replace_once(
              "package.json",
              '      "electron/main.cjs",\n',
              '      "electron/main.cjs",\n      "electron/renderer-injection-core.cjs",\n',
          )
          replace_once(
              "quality_check.py",
              '        "electron/main.cjs",\n',
              '        "electron/main.cjs",\n        "electron/renderer-injection-core.cjs",\n',
          )
          replace_once(
              "quality_check.py",
              '        "tests/phone-motion-core.test.cjs",\n',
              '        "tests/phone-motion-core.test.cjs",\n        "tests/renderer-injection-core.test.cjs",\n',
          )

          # Renderer manifest contract now parses the canonical constant and requires the
          # sequential generation-aware core rather than a fire-and-forget loop.
          replace_once(
              "tests/desktop-ux-manifest.test.cjs",
              'const main = fs.readFileSync(path.join(root, "electron/main.cjs"), "utf8");\n',
              'const main = fs.readFileSync(path.join(root, "electron/main.cjs"), "utf8");\nconst injectionCore = fs.readFileSync(path.join(root, "electron/renderer-injection-core.cjs"), "utf8");\n',
          )
          replace_once(
              "tests/desktop-ux-manifest.test.cjs",
              'const injection = main.match(/for \\(const filename of \\[(.*?)\\]\\) \\{/s);\nassert.ok(injection, "electron/main.cjs must keep one explicit renderer injection manifest");\n',
              'const injection = main.match(/MAIN_RENDERER_FILES = Object\\.freeze\\(\\[(.*?)\\]\\)/s);\nassert.ok(injection, "electron/main.cjs must keep one explicit renderer injection manifest");\n',
          )
          replace_once(
              "tests/desktop-ux-manifest.test.cjs",
              'assert.match(mainEntry, /inject\\(\\)\\.finally\\(\\(\\) => listener\\(\\.\\.\\.args\\)\\)/,\n  "existing did-finish-load UX injection must wait for the Take prelude");\n\nconsole.log("desktop-ux-manifest: reload-safe phone renderer manifests are synchronized with packaging and fallback injection");\n',
              '''assert.match(mainEntry, /createRendererInjector/,\n  "Take prelude must use the deterministic renderer injection core");\nassert.match(main, /createRendererInjector/,\n  "desktop UX must use the deterministic renderer injection core");\nassert.match(injectionCore, /for \\(const entry of normalizedEntries\\)/,\n  "renderer modules must be applied by one sequential manifest loop");\nassert.match(injectionCore, /await withTimeout\\(/,\n  "each renderer module must complete before the next dependency runs");\nassert.match(injectionCore, /failedGeneration === targetGeneration/,\n  "a partially failed renderer generation must remain fail-closed until reload");\nassert.equal(/executeJavaScript\\(source, true\\)\\.catch/.test(main), false,\n  "desktop renderer modules must not be launched concurrently with fire-and-forget promises");\nassert.ok(packageJson.build.files.includes("electron/renderer-injection-core.cjs"),\n  "deterministic renderer injection core must ship in the desktop package");\n\nconsole.log("desktop-ux-manifest: canonical renderer order is sequential, generation-safe, fail-closed, and packaged");\n''',
          )

          # Electron/security contract: startup fallback, cleanup and renderer integrity are
          # package-level guarantees, not just unit-test implementation details.
          replace_once(
              "tests/electron-contract.test.cjs",
              'const main = fs.readFileSync(path.join(root, "electron/main.cjs"), "utf8");\n',
              'const main = fs.readFileSync(path.join(root, "electron/main.cjs"), "utf8");\nconst rendererInjectionCore = fs.readFileSync(path.join(root, "electron/renderer-injection-core.cjs"), "utf8");\n',
          )
          replace_once(
              "tests/electron-contract.test.cjs",
              'assert.ok(packageJson.build.files.includes("electron/main.cjs"));\n',
              'assert.ok(packageJson.build.files.includes("electron/main.cjs"));\nassert.ok(packageJson.build.files.includes("electron/renderer-injection-core.cjs"));\n',
          )
          replace_once(
              "tests/electron-contract.test.cjs",
              'assert.match(main, /runtime\\.json/);\n',
              '''assert.match(main, /runtime\\.json/);\nassert.match(mainEntry, /renderer-injection-core\\.cjs/,\n  "Take prelude must share the packaged deterministic renderer injector");\nassert.match(main, /renderer-injection-core\\.cjs/,\n  "desktop UX must share the packaged deterministic renderer injector");\nassert.match(rendererInjectionCore, /DEFAULT_SCRIPT_TIMEOUT_MS = 8000/,\n  "a broken renderer module must not hang desktop startup forever");\nassert.match(rendererInjectionCore, /targetGeneration !== generation/,\n  "renderer injection must stop when navigation advances the document generation");\nassert.match(main, /--fallback-port/,\n  "desktop server launch must allow recovery when the persisted local port is occupied");\nassert.equal(main.includes("저장된 로컬 포트와 다른 서버가 시작되었습니다."), false,\n  "a safe nonce-verified port fallback must not make desktop startup fail permanently");\nassert.match(main, /if \\(serverProcess === child\\) killServerProcess\\(\\);[\\s\\S]*?serverOrigin = "";[\\s\\S]*?throw error;/,\n  "failed local-server startup must terminate its child and clear the trusted origin");\nassert.match(main, /`\\$\\{statePath\\}\\.\\$\\{process\\.pid\\}\\.\\$\\{Date\\.now\\(\\)\\}\\.tmp`/,\n  "runtime state must use a collision-resistant atomic temporary file");\nassert.match(server, /def bind_http_server\\(/);\nassert.match(server, /errno\\.EADDRINUSE/);\nassert.match(server, /--fallback-port/);\n''',
          )

          # Temporary workflow must never survive the patch commit.
          Path(".github/workflows/tmp-runtime-integrity-patch.yml").unlink()
          PY
      - name: Run targeted integrity tests
        shell: bash
        run: |
          set -euo pipefail
          node --check electron/renderer-injection-core.cjs
          node --check electron/main-entry.cjs
          node --check electron/main.cjs
          node tests/renderer-injection-core.test.cjs
          node tests/project-recovery-core.test.cjs
          node tests/desktop-ux-manifest.test.cjs
          node tests/electron-contract.test.cjs
          python -m unittest tests.test_server_security
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden runtime integrity across desktop lifecycle"
          git push origin HEAD:hardening/runtime-integrity-v3
