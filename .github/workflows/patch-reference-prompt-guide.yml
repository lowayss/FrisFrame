name: Patch reference prompt guide

on:
  push:
    branches:
      - feature/reference-prompt-guide-20260829

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reference prompt guide
        run: python3 tools/patch_reference_prompt_guide.py
      - name: Run full quality checks
        run: python3 quality_check.py
      - name: Commit validated prompt guide
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reference-workflow-core.js tests/reference-prompt-guide.test.cjs quality_check.py REFERENCE_PROMPT_GUIDE.md README.md README.en.md
          git commit -m "Add reference prompt guide"
          git push
