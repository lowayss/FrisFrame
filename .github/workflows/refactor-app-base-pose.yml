name: One-shot app base pose extraction

on:
  push:
    branches:
      - refactor/app-base-pose-evaluator-20260829
    paths:
      - .github/workflows/refactor-app-base-pose.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/app-base-pose-evaluator-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact base pose extraction
        run: python3 tools/refactor_app_base_pose.py
      - name: Run full project checks
        run: python3 quality_check.py
      - name: Commit extracted evaluator composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js motion-core.js tests/motion-core.test.cjs tests/reference-video-contract.test.cjs tests/dom-contract.test.cjs
          git diff --cached --check
          git commit -m "Extract base pose composition from app evaluator"
          git push origin HEAD:refactor/app-base-pose-evaluator-20260829
