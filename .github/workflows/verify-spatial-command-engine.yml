name: Verify spatial command engine

on:
  push:
    branches: [feat/spatial-command-engine-v1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-command-engine-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run spatial command engine integration test
        run: python3 tests/spatial-command-engine-mcp.py
      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-spatial-command-engine.yml
          git commit -m "chore: remove spatial command verification workflow"
          git push origin HEAD:feat/spatial-command-engine-v1
