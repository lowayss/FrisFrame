name: Patch reference filename bytes

on:
  push:
    branches:
      - hardening/reference-filename-utf8-bytes-20260829

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply UTF-8 filename bound
        run: python3 tools/patch_reference_filename_bytes.py
      - name: Run full quality checks
        run: python3 quality_check.py
      - name: Commit validated hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add motion-core.js tests/reference-batch-export.test.cjs
          git commit -m "Bound reference filenames by UTF-8 bytes"
          git push
