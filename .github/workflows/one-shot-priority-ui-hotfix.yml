name: One-shot priority UI hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run priority UI hotfix on main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Apply priority UI hotfix
        run: python3 tools/one_shot_priority_ui_hotfix.py

      - name: Verify source contracts
        run: npm run check

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit main hotfix and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/one_shot_priority_ui_hotfix.py .github/workflows/one-shot-priority-ui-hotfix.yml
          git add index.html styles.css .github/workflows/desktop-builds.yml
          git commit -m "Apply priority UI removals on main"
          git push origin HEAD:main
