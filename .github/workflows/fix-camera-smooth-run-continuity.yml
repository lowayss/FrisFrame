name: One-shot camera smooth run continuity

on:
  push:
    branches:
      - fix/camera-smooth-run-continuity-20260829
    paths:
      - .github/workflows/fix-camera-smooth-run-continuity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/camera-smooth-run-continuity-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply camera smooth run continuity
        run: python3 tools/fix_camera_smooth_run_continuity.py
      - name: Run full project checks
        run: python3 quality_check.py
      - name: Commit camera smooth run continuity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-core.js app.js tests/motion-core.test.cjs tests/reference-frame-ownership.test.cjs tests/reference-video-contract.test.cjs
          git diff --cached --check
          git commit -m "Keep smooth camera runs continuous"
          git push origin HEAD:fix/camera-smooth-run-continuity-20260829
