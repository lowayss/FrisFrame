name: Temporary apply runtime port fix

on:
  push:
    branches:
      - hardening/runtime-integrity-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/runtime-integrity-v3
      - name: Apply cross-platform port fallback patch
        run: python .github/tmp_windows_port_patch.py
      - name: Verify targeted contracts
        run: |
          python -m unittest tests.test_server_security
          node tests/electron-contract.test.cjs
      - name: Commit cleaned patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: classify occupied local ports across platforms"
          git push origin HEAD:hardening/runtime-integrity-v3
