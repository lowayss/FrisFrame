name: Integrate FrisFrame 0.6 security lockfile

on:
  push:
    branches:
      - integration/frisframe-0.6.0-security

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/frisframe-0.6.0-security
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install 0.6 locked dependencies
        run: npm ci
      - name: Refresh transitive audit fixes in lockfile only
        run: npm audit fix --package-lock-only
      - name: Reinstall exact integrated lockfile
        run: npm ci
      - name: Require zero vulnerabilities
        shell: bash
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Run full FrisFrame contracts
        run: npm run check
      - name: Commit integrated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: integrate 0.6.0 security lockfile"
          git push origin HEAD:integration/frisframe-0.6.0-security
