name: One-shot production helper cleanup

on:
  push:
    branches:
      - refactor/mcp-first-previs-workflow

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mcp-first-previs-workflow
          fetch-depth: 0
      - name: Remove retired production helper chain
        run: python3 tools/one_shot_retire_production_helpers.py
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Verify full project contracts
        run: python3 quality_check.py
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js index.html styles.css tests/dom-contract.test.cjs; then
            echo "No cleanup diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css tests/dom-contract.test.cjs
          git commit -m "Remove retired production and prompt helper chain"
          git push origin HEAD:refactor/mcp-first-previs-workflow
