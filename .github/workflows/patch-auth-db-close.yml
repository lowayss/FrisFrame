name: Patch auth database close

on:
  push:
    branches:
      - hardening/auth-db-close-20260829

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply auth database cleanup
        run: python3 tools/patch_auth_db_close.py
      - name: Run full quality checks
        run: python3 quality_check.py
      - name: Commit validated hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.py tests/test_server_security.py
          git commit -m "Close auth database connections on failure"
          git push
