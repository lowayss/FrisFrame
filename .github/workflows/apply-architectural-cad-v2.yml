name: Apply architectural CAD v2 patch

on:
  push:
    branches:
      - feat/wall-endpoint-drag-opening-reattach

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wall-endpoint-drag-opening-reattach
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch source
        run: python3 scripts/patch_architectural_cad_v2.py
      - name: Validate patched runtime
        run: |
          node --check multi-camera-core.js
          node tests/architectural-cad-runtime.test.cjs
          node tests/architectural-cad-v2-runtime.test.cjs
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/patch_architectural_cad_v2.py
          rm .github/workflows/apply-architectural-cad-v2.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply wall endpoint CAD v2"
          git push origin HEAD:feat/wall-endpoint-drag-opening-reattach
